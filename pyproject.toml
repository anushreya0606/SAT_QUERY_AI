[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isro-vlm"
version = "0.1.0"
description = "ISRO/SAC Remote Sensing Vision-Language Model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "pydantic>=2.0",
    "Pillow",
    "numpy",
    "scikit-learn",
    "nltk",
    "evaluate",
    "tqdm",
    "datasets",
    "huggingface-hub",
    "accelerate",
    "rasterio",
    "tabulate",
]

[project.optional-dependencies]
train = [
    "peft>=0.6.0",
    "wandb",
    "bitsandbytes",
]
cider = [
    "pycocoevalcap",
]
dev = [
    "pytest>=7.0",
    "black",
    "flake8",
]
all = [
    "isro-vlm[train,cider,dev]",
]

[project.scripts]
isro-vlm = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eval*", "models*", "schema*", "data*", "train*"]
